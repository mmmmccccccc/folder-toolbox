[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folder-toolbox"
version = "0.1.0"
description = "Three small programs that clean up one Windows folder, with a record of every change."
requires-python = ">=3.10"

[project.scripts]
folder-toolbox = "files_toolbox.cli:main"
